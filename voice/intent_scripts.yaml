CancelMowing:
  speech:
    text: >-
      {% set running = is_state('script.mow_the_front_yard','on')
         or is_state('script.mow_the_backyard','on')
         or is_state('script.mow_the_yard','on')
         or is_state('input_boolean.mow_yard_active','on')
         or states('lawn_mower.luba_3') in ['mowing','returning','paused'] %}
      {% if running %}
        Canceling the mow.
      {% else %}
        Not currently mowing.
      {% endif %}
  action:
    - if:
      - condition: template
        value_template: >-
          {{ is_state('script.mow_the_front_yard','on')
             or is_state('script.mow_the_backyard','on')
             or is_state('script.mow_the_yard','on')
             or is_state('input_boolean.mow_yard_active','on')
             or states('lawn_mower.luba_3') in ['mowing','returning','paused'] }}
      then:
      - action: script.turn_on
        target:
          entity_id: script.mower_cancel_and_dock
